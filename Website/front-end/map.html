<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Access London — map</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&amp;display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
body{margin:0;background:#F2F3DC}
a{color:inherit}
.ma *:focus-visible{outline:3px solid #233A6B;outline-offset:3px}
.ma button{font-family:'Outfit',Arial,sans-serif;color:#26261F}
.ma-stage{position:relative;flex:1;min-height:0;overflow:hidden;container-type:size;container-name:stage}
.ma-panel{position:absolute;left:20px;top:84px;bottom:20px;width:400px;z-index:5;overflow:hidden;box-sizing:border-box;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(31,48,24,.18);transition:background .5s,max-height .35s ease,transform .35s ease,visibility 0s}
/* "Map only": the panel slides out to the left. visibility:hidden (after the slide) stops
   keyboard users tabbing into a panel they can't see. */
.ma-panel.ma-collapsed{transform:translateX(calc(-100% - 30px));visibility:hidden;transition:background .5s,transform .35s ease,visibility 0s linear .35s}
/* the tab on the panel's edge that hides and shows it */
.ma-paneltab{position:absolute;left:420px;top:50%;z-index:6;transform:translateY(-50%);width:30px;height:72px;border:none;border-radius:0 16px 16px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:6px 8px 20px rgba(31,48,24,.16);transition:left .35s ease,background .5s}
.ma-stage.is-collapsed .ma-paneltab{left:0}
.ma-stage.is-collapsed .ma-crumb{left:44px}
.ma-stage.is-collapsed .ma-tilewrap{left:54px}
.ma-crumb,.ma-tilewrap{transition:left .35s ease}
@media (prefers-reduced-motion: reduce){.ma-panel,.ma-paneltab,.ma-crumb,.ma-tilewrap{transition:none !important}}
.ma-handle{display:none}
/* The panel's content scrolls inside it (not the panel itself): a scrolling panel on top of
   the WebGL map drew a blank patch over the map in Chromium. */
.ma-panel > div, .ma-panel > p{flex:1 1 auto;min-height:0;overflow-y:auto}
.ma-tilewrap{position:absolute;left:440px;right:24px;top:64px;bottom:0;display:flex;align-items:center;justify-content:center;padding:24px 0}
.ma-crumb{position:absolute;left:440px;top:20px;z-index:4}
.ma-legend{position:absolute;right:20px;bottom:44px;z-index:4}
/* the card above the pin you're pointing at */
.lm-tip{position:absolute;left:0;top:0;z-index:6;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px 12px;border-radius:18px;background:rgba(251,251,242,0.97);box-shadow:0 12px 28px rgba(31,48,24,0.2);font-family:'Outfit',Arial,sans-serif;color:#26261F;opacity:0;transition:opacity .14s ease-out;will-change:transform}
.lm-tip.on{opacity:1}
.lm-tip b{display:block;font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-0.01em}
.lm-tip .tm{display:block;margin-top:3px;font-size:14px;color:#5C5D4C}
.lm-tip .tc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lm-tip .ch{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500}
.lm-tip .ci{flex:none;width:30px;height:30px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.lm-tip .tn{display:block;margin-top:9px;font-size:13px;color:#7A3A12;font-weight:500}
.lm-tip .sim{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;background:#F6E3CC;color:#7A3A12;border-radius:8px;padding:2px 8px}
@media (prefers-reduced-motion:reduce){.lm-tip{transition:none}}
.ma-ctrl{position:absolute;right:20px;top:84px;z-index:4;display:flex;flex-direction:column;gap:8px}
.ma-navlink{display:inline-block}
@keyframes mazoom{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes matoast{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.ma-enter{animation:mazoom .45s ease both}
@media (prefers-reduced-motion: reduce){.ma-enter{animation:none}}
/* map credits: small, in the bottom-right corner, under the key */
.ma .maplibregl-ctrl-bottom-right{bottom:6px;right:8px}
.ma .maplibregl-ctrl-attrib{font:12px 'Outfit',Arial,sans-serif;background:rgba(251,251,242,.85);border-radius:10px}

/* ---- Floating top bar: no solid header, so the map runs to the top edge ---- */
.ma-top{position:absolute;top:0;left:0;right:0;z-index:8;height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;transition:background .5s}
.ma-top > *{pointer-events:auto}
.ma-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#26261F;background:rgba(251,251,242,.92);border-radius:18px;padding:6px 14px 6px 6px;box-shadow:0 6px 18px rgba(31,48,24,.12)}
.ma-logo b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.ma-logo small{font-size:13px;color:#5C5D4C;margin-left:-4px}
.ma-glass{background:rgba(251,251,242,.92);box-shadow:0 6px 18px rgba(31,48,24,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ma-about{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:16px;text-decoration:none;color:#26261F;font-size:16px}

/* ---- Buttons: a small press, so taps feel answered ---- */
.ma button,.ma-about,.ma-logo{transition:transform .12s ease-out,background-color .2s ease,box-shadow .2s ease}
.ma button:active,.ma-about:active,.ma-logo:active{transform:scale(.97)}
.ma-iconbtn{width:52px;height:52px;flex:none;border-radius:16px;border:none;background:#FBFBF2;box-shadow:0 8px 20px rgba(31,48,24,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:24px;font-weight:600}
.ma-iconbtn[aria-pressed="true"]{background:#26261F;color:#F2F3DC}
.ma-iconbtn[aria-pressed="true"] svg{stroke:#F2F3DC}
.ma-outline{width:54px;height:54px;flex:none;border:2px solid #9A9B82;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ma-outline[aria-pressed="true"]{background:#26261F;border-color:#26261F}
.ma-chip{min-height:44px;display:inline-flex;align-items:center;gap:7px;border-radius:22px;padding:0 13px;font-size:15px;cursor:pointer}

/* ---- Search: the focus ring goes round the whole rounded box (it used to draw a dark
   rectangle around the bare input inside it) ---- */
.ma-search{position:relative;display:flex;flex-direction:column;gap:6px}
.ma-searchbox{display:flex;align-items:center;gap:10px;background:#FBFBF2;border:2px solid #D3D4B8;border-radius:16px;padding:2px 14px;transition:border-color .15s ease,box-shadow .15s ease}
.ma-searchbox:focus-within{border-color:#233A6B;box-shadow:0 0 0 3px rgba(35,58,107,.18)}
.ma-searchbox input{flex:1;min-width:0;border:none;background:transparent;font-family:'Outfit',Arial,sans-serif;font-size:17px;padding:12px 0;color:#26261F;outline:none}
.ma .ma-searchbox input:focus-visible{outline:none}
.ma-searchbox input::-webkit-search-cancel-button{cursor:pointer}
.ma-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ma-suggest{list-style:none;margin:0;padding:6px;border-radius:18px;background:#FBFBF2;box-shadow:0 12px 30px rgba(31,48,24,.16);display:flex;flex-direction:column;gap:2px;animation:masug .16s ease-out both;transform-origin:top center}
@keyframes masug{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.ma-sugg{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;text-align:left;border:none;border-radius:12px;background:transparent;padding:6px 8px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.ma-sugg:hover{background:#ECEDD3}}
.ma-sugg-icon{flex:none;width:36px;height:36px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.ma-sugg-text{display:flex;flex-direction:column;min-width:0}
.ma-sugg-text b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma-sugg-text span{font-size:13px;color:#5C5D4C}
.ma-nores{margin:0;font-size:15px;color:#4B4C3D}
.ma-foot{margin-top:auto;padding-top:8px;font-size:14px;color:#5C5D4C}
.ma-foot a{color:#26261F;font-weight:600}
/* "you are here" and the station markers on the real map, in the mockup's style */
.lm-you{width:22px;height:22px;border-radius:50%;background:#233A6B;border:4px solid #F2F3DC;box-sizing:border-box;box-shadow:0 0 0 12px rgba(35,58,107,0.14)}
.lm-station{display:flex;align-items:center;gap:6px;pointer-events:none}
.lm-station span{flex:none;width:28px;height:28px;border-radius:50%;background:#233A6B;color:#FBFBF2;font:600 14px 'Outfit',Arial,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #FBFBF2,0 6px 14px rgba(31,48,24,.3)}
.lm-station em{font:600 13px 'Outfit',Arial,sans-serif;font-style:normal;padding:3px 8px;border-radius:8px;background:rgba(251,251,242,.92);white-space:nowrap}
@container app (max-width: 760px){
.ma-panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52%;border-radius:26px 26px 0 0;padding:10px 16px 18px}
.ma-panel.ma-peek{max-height:118px;overflow:hidden}
.ma-panel.ma-collapsed{transform:none;visibility:visible}
.ma-paneltab{display:none}
.ma-stage.is-collapsed .ma-crumb{left:12px}
.ma-stage.is-collapsed .ma-tilewrap{left:10px}
.ma-handle{display:flex}
.ma-tilewrap{left:10px;right:10px;top:8px;bottom:auto;height:47%;padding:0;align-items:flex-start}
.ma-tilecard{padding:12px !important;gap:8px !important;border-radius:22px !important}
.ma-tilelegend{display:none !important}
.ma-legend{display:none !important}
.ma-ctrl{right:12px;top:76px}
.ma-navlink{display:none}
.ma-switchlabel{display:none}
.ma-top{padding:0 12px}
.ma-logo small,.ma-logo b{display:none}
.ma-logo{padding:6px}
.ma .maplibregl-ctrl-bottom-right{bottom:auto;top:76px;right:auto;left:8px}
}
</style>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="js/map-look.js"></script>
<script src="js/london-map.js"></script>
<script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script src="js/answers-config.js"></script>
<script src="js/answers.js"></script>
<script>window.ACCESS_DATA_ROOT = '../data/'; // pages are in Website/front-end, data in Website/data</script>
<script src="js/london-data.js"></script>
<script src="js/dc-runtime.js"></script>
</head>
<body>
<template id="dc-template">
<div class="ma" style="container-type: inline-size; container-name: app; height: 100vh; height: 100dvh; min-height: 600px; display: flex; flex-direction: column; background: {{bg}}; transition: background .5s; color: #26261F; font-family: 'Outfit', Arial, sans-serif;">

<header class="ma-top" style="background: {{topFade}};">
<a class="ma-logo" href="index.html" aria-label="Access London, home"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="13" style="fill: {{accent}}"></rect><path d="M20 7.5c-5.8 0-10.5 4.5-10.5 10.2 0 7.4 10.5 15.3 10.5 15.3s10.5-7.9 10.5-15.3C30.5 12 25.8 7.5 20 7.5z" fill="#F2F3DC"></path><path d="M16.2 23v-6.2a3.8 3.8 0 0 1 7.6 0V23z" style="fill: {{accent}}"></path><path d="M13.5 23h13" stroke="#26261F" stroke-width="1.8" stroke-linecap="round"></path></svg><b>Access</b><small>London</small></a>
<div class="ma-glass" role="group" aria-label="Use the map as" style="display: flex; gap: 4px; border-radius: 18px; padding: 4px;">
<sc-for list="{{modes}}" as="m">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" aria-label="{{m.label}}" style="min-height: 46px; min-width: 52px; border: none; border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: {{m.bg}}; color: {{m.fg}}; font-size: 16px; font-weight: 500; cursor: pointer;">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg><span class="ma-switchlabel">{{m.label}}</span>
</button>
</sc-for>
</div>
<a class="ma-about ma-glass" href="about.html" aria-label="About Access London"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg><span class="ma-switchlabel">About</span></a>
</header>

<main class="{{stageClass}}">

<!-- The real map. It always stays the first thing in <main>, and data-dc-preserve tells the
     page renderer to leave it alone, so MapLibre keeps its canvas between redraws. -->
<div style="position: absolute; inset: 0; visibility: {{mapVis}};"><div id="lm" data-dc-preserve style="position: absolute; inset: 0;"></div></div>

<sc-if value="{{isCity}}">
<div class="ma-enter" style="position: absolute; inset: 0;">
<svg aria-hidden="true" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%;">
<defs><pattern id="maLawn" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="150" height="150" style="fill: {{lawnA}}"></rect><rect width="75" height="150" style="fill: {{lawnB}}"></rect></pattern></defs>
<rect width="1600" height="900" fill="url(#maLawn)"></rect>
<path d="M1000 40 C1240 0 1560 80 1600 300 C1640 520 1460 700 1180 690 C960 680 900 540 910 400 C920 260 820 70 1000 40 Z" style="fill: {{lawnC}}"></path>
<path d="M-40 640 C240 580 460 520 700 470 S1160 340 1660 270" style="stroke: {{path}}" stroke-width="80" fill="none" stroke-linecap="round"></path>
<path d="M-40 640 C240 580 460 520 700 470 S1160 340 1660 270" style="stroke: {{pathLine}}" stroke-width="3" fill="none" stroke-dasharray="20 18"></path>
<g style="fill: {{treeA}}"><circle cx="1480" cy="780" r="62"></circle><circle cx="300" cy="140" r="50"></circle><circle cx="860" cy="820" r="40"></circle></g>
<g style="fill: {{treeB}}"><circle cx="1462" cy="762" r="28"></circle><circle cx="286" cy="128" r="22"></circle><circle cx="850" cy="810" r="16"></circle></g>
</svg>
<div class="ma-tilewrap">
<div class="ma-tilecard" style="width: min(620px, 100%); max-height: 100%; background: rgba(242,243,220,0.96); border-radius: 30px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(20,35,15,0.25);">
<div aria-live="polite" style="min-height: 26px; font-size: 18px; font-weight: 600;">{{hoverText}}</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px;">
<sc-for list="{{tiles}}" as="t">
<sc-if value="{{t.isTile}}">
<button type="button" onClick="{{t.pick}}" onMouseEnter="{{t.enter}}" onMouseLeave="{{t.leave}}" onFocus="{{t.enter}}" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" style="aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 12px; border: {{t.border}}; box-sizing: border-box; background: {{t.bg}}; color: {{t.fg}}; font-size: clamp(10px, 1.1cqw, 14px); font-weight: 600; cursor: pointer; transition: background .4s, transform .15s; transform: {{t.tf}};">{{t.code}}</button>
</sc-if>
<sc-if value="{{t.isEmpty}}"><span aria-hidden="true"></span></sc-if>
</sc-for>
</div>
<div class="ma-tilelegend" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: #4B4C3D;">
<span>{{legendLow}}</span>
<sc-for list="{{legend}}" as="lg"><span style="width: 26px; height: 16px; border-radius: 5px; background: {{lg}};"></span></sc-for>
<span>{{legendHigh}}</span>
<sc-if value="{{isVisit}}"><span style="display: flex; align-items: center; gap: 6px; margin-left: 8px;"><span style="width: 16px; height: 16px; border-radius: 5px; border: 2px dashed #8E8F78; background: #DCDAC8; box-sizing: border-box;"></span>Too few places checked</span></sc-if>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isArea}}">
<div class="ma-ctrl">
<button type="button" class="ma-iconbtn" onClick="{{zoomIn}}" aria-label="Zoom in"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<button type="button" class="ma-iconbtn" onClick="{{zoomOut}}" aria-label="Zoom out"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
<button type="button" class="ma-iconbtn" onClick="{{toggle3d}}" aria-pressed="{{threeDPressed}}" aria-label="3D view: tilt the map and raise the buildings" title="3D view"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg></button>
<button type="button" class="ma-iconbtn" onClick="{{locate}}" aria-label="Go to where I am"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#233A6B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</div>

</sc-if>

<button type="button" class="ma-paneltab" onClick="{{togglePanel}}" aria-controls="ma-panel" aria-expanded="{{panelExpanded}}" aria-label="{{panelTabLabel}}" title="{{panelTabLabel}}" style="background: {{panelBg}};"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{panelTabIcon}}"></path></svg></button>

<aside id="ma-panel" class="{{panelClass}}" aria-label="{{panelLabel}}" style="background: {{panelBg}};">
<button type="button" class="ma-handle" onClick="{{toggleSheet}}" aria-label="{{sheetLabel}}" aria-expanded="{{sheetOpen}}" style="flex: none; align-self: stretch; min-height: 32px; border: none; background: transparent; cursor: pointer; align-items: center; justify-content: center;"><span style="width: 44px; height: 5px; border-radius: 3px; background: #B9B9A0;"></span></button>

<sc-if value="{{hasFatal}}">
<div role="alert" style="background: #F6E3CC; border: 2px solid #C2602A; border-radius: 18px; padding: 16px; font-size: 16px; line-height: 1.45;"><b style="display: block; font-size: 18px; margin-bottom: 6px;">The map can’t start</b>{{fatal}}</div>
</sc-if>
<sc-if value="{{loading}}">
<p role="status" style="margin: 0; font-size: 17px; font-weight: 600;">{{loadingText}}</p>
</sc-if>

<!-- ===== London: pick a borough ===== -->
<sc-if value="{{pCity}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; color: {{accentText}};">{{cityTitle}}</h1>
<div class="ma-search">
<label class="ma-searchbox"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B4C3D" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span class="ma-sr">{{searchLabel}}</span>
<input type="search" value="{{q}}" onInput="{{onSearch}}" onKeyDown="{{onSearchKey}}" placeholder="{{searchHint}}" autocomplete="off" aria-describedby="ma-search-help">
</label>
<span id="ma-search-help" class="ma-sr">Matches appear below as you type. Press Enter to go to the first one.</span>
<sc-if value="{{hasSuggest}}">
<ul class="ma-suggest" aria-label="Matches">
<sc-for list="{{suggest}}" as="m"><li><button type="button" class="ma-sugg" onClick="{{m.pick}}"><span class="ma-sugg-icon" style="background: {{m.bg}}; border: {{m.border}};"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg></span><span class="ma-sugg-text"><b>{{m.name}}</b><span>{{m.where}}</span></span></button></li></sc-for>
</ul>
</sc-if>
<sc-if value="{{noSuggest}}"><p class="ma-nores">{{noSuggestText}}</p></sc-if>
</div>
<button type="button" onClick="{{useLocation}}" style="min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 18px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 17px; font-weight: 500; cursor: pointer;">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg><span style="color: {{ctaFg}};">Use my location</span></button>
<sc-if value="{{hasBoro}}">
<div style="background: {{cardBg}}; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 26px; font-weight: 600; line-height: 1.1;">{{bo.name}}</span><span style="font-size: 15px; color: #4B4C3D;">{{bo.tagline}}</span></div>
<span style="flex: none; width: 82px; height: 82px; border-radius: 50%; background: {{bo.ringBg}}; color: {{bo.ringFg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;"><span style="font-size: 28px; font-weight: 600;">{{bo.big}}</span><span style="font-size: 12px; padding-top: 3px;">{{bo.unit}}</span></span>
</div>
<div style="display: flex; align-items: center; gap: 10px;"><span style="flex: 1; height: 10px; border-radius: 5px; background: rgba(38,38,31,0.1); overflow: hidden;"><span style="display: block; height: 10px; width: {{bo.barW}}; background: {{accent}};"></span></span><span style="font-size: 14px; color: #4B4C3D; white-space: nowrap;">{{bo.barText}}</span></div>
<button type="button" onClick="{{openBoro}}" style="min-height: 54px; border: none; border-radius: 16px; background: #26261F; color: #F2F3DC; font-size: 17px; font-weight: 500; cursor: pointer;"><span style="color: #F2F3DC;">{{bo.cta}}</span></button>
<span style="font-size: 13px; color: #5C5D4C;">{{bo.note}}</span>
</div>
</sc-if>
<sc-if value="{{noBoro}}"><p style="margin: 0; font-size: 16px; line-height: 1.45; color: #4B4C3D;">{{cityHint}}</p></sc-if>
<p class="ma-foot">Something wrong, or an idea? <a href="about.html#contact">Contact us</a></p>
</div>
</sc-if>

<!-- ===== Visitor: places in the borough ===== -->
<sc-if value="{{pVList}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; color: #2F6B3C;">{{areaName}}</h1>
<button type="button" onClick="{{toCity}}" aria-label="Choose another area of London" style="min-height: 44px; display: flex; align-items: center; gap: 7px; border: 2px solid {{line}}; border-radius: 14px; background: transparent; padding: 0 12px; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>London</button>
</div>
<div class="ma-search">
<label class="ma-searchbox"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B4C3D" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span class="ma-sr">{{searchLabel}}</span>
<input type="search" value="{{q}}" onInput="{{onSearch}}" onKeyDown="{{onSearchKey}}" placeholder="{{searchHint}}" autocomplete="off" aria-describedby="ma-search-help">
</label>
<span id="ma-search-help" class="ma-sr">Matches appear below as you type. Press Enter to go to the first one.</span>
<sc-if value="{{hasSuggest}}">
<ul class="ma-suggest" aria-label="Matches">
<sc-for list="{{suggest}}" as="m"><li><button type="button" class="ma-sugg" onClick="{{m.pick}}"><span class="ma-sugg-icon" style="background: {{m.bg}}; border: {{m.border}};"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icon}}"></path></svg></span><span class="ma-sugg-text"><b>{{m.name}}</b><span>{{m.where}}</span></span></button></li></sc-for>
</ul>
</sc-if>
<sc-if value="{{noSuggest}}"><p class="ma-nores">{{noSuggestText}}</p></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 17px; font-weight: 600;">What do you need?</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
<sc-for list="{{needs}}" as="n">
<button type="button" onClick="{{n.toggle}}" aria-pressed="{{n.pressed}}" style="min-height: 62px; display: flex; align-items: center; gap: 10px; text-align: left; border-radius: 16px; border: {{n.border}}; background: {{n.bg}}; padding: 8px 10px; font-size: 15px; font-weight: 500; cursor: pointer;">
<span style="flex: none; width: 36px; height: 36px; border-radius: 11px; background: {{n.iconBg}}; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{n.iconFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg></span>{{n.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 17px; font-weight: 600;">Kinds of place <span style="font-weight: 400; font-size: 14px; color: #5C5D4C;">pick any</span></span>
<div role="group" aria-label="Kinds of place, pick any" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{cats}}" as="c"><button type="button" class="ma-chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="border: {{c.border}}; background: {{c.bg}};"><sc-if value="{{c.icon}}"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg></sc-if><span style="color: {{c.fg}};">{{c.label}}</span></button></sc-for>
</div>
</div>
<sc-if value="{{askLocation}}">
<button type="button" onClick="{{locate}}" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid {{line}}; border-radius: 14px; background: #FBFBF2; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#233A6B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Use my location to see how far</button>
</sc-if>
<p aria-live="polite" style="margin: 0; font-size: 17px; font-weight: 600;">{{countText}}</p>
<sc-if value="{{noMatch}}">
<div style="background: #FBFBF2; border: 2px dashed #8E8F78; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 17px; font-weight: 600;">Nothing here is known to have all of this yet.</span>
<span style="font-size: 15px; color: #4B4C3D;">Places that might are listed below. Zoom out to look further.</span>
<button type="button" onClick="{{dropNeed}}" style="min-height: 48px; border: none; border-radius: 14px; background: #26261F; color: #F2F3DC; font-size: 15px; cursor: pointer;"><span style="color: #F2F3DC;">{{dropText}}</span></button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{results}}" as="r">
<button type="button" onClick="{{r.open}}" onMouseEnter="{{r.enter}}" onMouseLeave="{{r.leave}}" aria-label="{{r.aria}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border-radius: 18px; border: 2px solid transparent; background: {{r.bg}}; padding: 12px; cursor: pointer; opacity: {{r.op}};">
<span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{r.pinBg}}; border: {{r.pinBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{r.pinFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 17px; font-weight: 600;">{{r.name}}</span><span style="display: flex; gap: 5px; flex-wrap: wrap;"><sc-for list="{{r.marks}}" as="m"><span style="font-size: 12px; border-radius: 8px; padding: 3px 7px; background: {{m.bg}}; color: {{m.fg}}; border: {{m.border}};">{{m.text}}</span></sc-for></span></span>
<sc-if value="{{r.hasMin}}"><span style="flex: none; display: flex; flex-direction: column; align-items: flex-end;"><span style="font-size: 18px; font-weight: 600;">{{r.min}}</span><span style="font-size: 12px; color: #5C5D4C;">min</span></span></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{moreText}}"><p style="margin: 0; font-size: 14px; color: #5C5D4C;">{{moreText}}</p></sc-if>
</div>
</sc-if>

<!-- ===== Visitor: one place ===== -->
<sc-if value="{{pVPlace}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; gap: 14px;">
<span style="flex: none; width: 60px; height: 60px; border-radius: 50%; background: {{pl.pinBg}}; border: {{pl.pinBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{pl.pinFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{pl.icon}}"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.1;">{{pl.name}}</h1><span style="font-size: 15px; color: #4B4C3D;">{{pl.meta}}</span></div>
<button type="button" class="ma-outline" onClick="{{backToList}}" aria-label="Close this place" title="Close" style="align-self: flex-start; width: 44px; height: 44px; border-radius: 50%;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<span style="align-self: flex-start; font-size: 17px; font-weight: 600; border-radius: 12px; padding: 8px 13px; background: {{pl.vBg}}; color: {{pl.vFg}}; border: {{pl.vBorder}};">{{pl.verdict}}</span>
<div style="display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{pl.rows}}" as="row">
<div style="display: flex; align-items: center; gap: 10px; background: {{row.bg}}; border-radius: 14px; padding: 11px 12px;">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B4C3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{row.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 15px;">{{row.label}}</span><sc-if value="{{row.mine}}"><span style="font-size: 12px; color: #2A5E35;">You need this</span></sc-if></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: {{row.fg}}; text-align: right;"><span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: {{row.dot}}; color: #F2F3DC; font-size: 13px; display: flex; align-items: center; justify-content: center; border: {{row.dotBorder}}; box-sizing: border-box;">{{row.mark}}</span>{{row.value}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{pl.note}}"><p style="margin: 0; font-size: 15px; background: #FBFBF2; border-left: 3px solid #2F6B3C; padding: 10px 12px;">{{pl.note}}</p></sc-if>
<sc-for list="{{pl.facts}}" as="f"><span style="font-size: 15px; color: #26261F;">{{f}}</span></sc-for>
<sc-if value="{{pl.web}}"><a href="{{pl.web}}" target="_blank" rel="noopener" style="font-size: 15px; font-weight: 600; color: #2F6B3C;">Their website: check before you go</a></sc-if>
<sc-if value="{{pl.confirm}}"><span style="font-size: 14px; color: #5C5D4C;">{{pl.confirm}}</span></sc-if>
<div style="display: flex; gap: 8px;">
<button type="button" onClick="{{act.dir}}" style="flex: 1; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; border: none; border-radius: 16px; background: #26261F; font-size: 16px; font-weight: 500; cursor: pointer;"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F2F3DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"></path></svg><span style="color: #F2F3DC;">Directions</span></button>
<button type="button" class="ma-outline" onClick="{{act.save}}" aria-pressed="{{act.saved}}" aria-label="{{act.saveLabel}}" title="{{act.saveLabel}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" stroke="{{act.saveStroke}}" stroke-width="2.2" stroke-linejoin="round" style="fill: {{act.saveFill}}"><path d="M6 3h12v18l-6-4.5L6 21z"></path></svg></button>
<button type="button" class="ma-outline" onClick="{{act.share}}" aria-label="Share a link to this place" title="Share"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></button>
</div>
<sc-if value="{{pl.hasGap}}">
<button type="button" onClick="{{fillGap}}" style="display: flex; align-items: center; gap: 12px; text-align: left; border: 2px dashed #C2602A; border-radius: 18px; background: #F6EDDC; padding: 14px; cursor: pointer;">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E8873A; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 16px;">Been here?</b><span style="font-size: 14px; color: #4B4C3D;">Fill in what’s missing</span></span></button>
</sc-if>
<div style="border-top: 1px solid {{line}}; padding-top: 14px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 16px; font-weight: 600;">Been here? Was this right?</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
<button type="button" onClick="{{confirmRight}}" style="min-height: 50px; border: 2px solid #9A9B82; border-radius: 14px; background: transparent; font-size: 15px; cursor: pointer;">Yes, it was</button>
<button type="button" onClick="{{startReport}}" style="min-height: 50px; border: 2px solid #9A9B82; border-radius: 14px; background: transparent; font-size: 15px; cursor: pointer;">Something was different</button>
</div>
</div>
</div>
</sc-if>

<!-- ===== Visitor: getting there ===== -->
<sc-if value="{{pVGo}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<button type="button" onClick="{{backToPlace}}" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; font-size: 16px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>{{pl.name}}</button>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;">Getting there</h1>
<span style="align-self: flex-start; font-size: 15px; font-weight: 600; border-radius: 10px; padding: 6px 11px; background: {{pl.vBg}}; color: {{pl.vFg}}; border: {{pl.vBorder}};">{{pl.verdict}}</span>
<div style="background: {{go.heroBg}}; color: {{go.heroFg}}; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85;">From where you are</span>
<sc-if value="{{go.hasDistance}}"><span style="font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -0.03em;">{{go.km}}</span><span style="font-size: 16px;">{{go.line}}</span><span style="font-size: 13px; opacity: 0.85;">Straight line plus a margin, not the real route.</span></sc-if>
<sc-if value="{{go.noDistance}}"><span style="font-size: 16px;">{{go.why}}</span>
<button type="button" onClick="{{go.locate}}" style="align-self: flex-start; min-height: 48px; border: none; border-radius: 14px; background: #233A6B; padding: 0 16px; font-size: 16px; font-weight: 500; cursor: pointer;"><span style="color: #FBFBF2;">Share my location</span></button>
<span style="font-size: 13px; color: #5C5D4C;">Your location stays on your device.</span></sc-if>
</div>
<a href="{{go.google}}" target="_blank" rel="noopener" style="min-height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #26261F; color: #F2F3DC; font-size: 17px; font-weight: 500; text-decoration: none;">Directions in Google Maps</a>
<a href="https://tfl.gov.uk/plan-a-journey/" target="_blank" rel="noopener" style="font-size: 15px; font-weight: 600; color: #2F6B3C;">Plan a step-free journey with TfL</a>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid {{line}}; padding-top: 14px;">
<span style="font-size: 17px; font-weight: 600;">Step-free stations nearby</span>
<sc-if value="{{go.warn}}"><p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #F6E3CC; font-size: 15px;">{{go.warn}}</p></sc-if>
<sc-for list="{{go.stations}}" as="s">
<div style="display: flex; gap: 12px; align-items: flex-start; background: {{cardBg}}; border-radius: 16px; padding: 12px;">
<span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #233A6B; color: #FBFBF2; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{s.letter}}</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 16px;">{{s.name}}</b><span style="font-size: 14px; color: #4B4C3D;">{{s.lines}}</span><span style="font-size: 14px; color: #4B4C3D;">{{s.dist}}</span></span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #5C5D4C;">Station lifts can be out of order. Check TfL on the day. Station information is TfL’s usual layout, not live.</p>
</div>
</sc-if>

<sc-if value="{{pVReport}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<button type="button" onClick="{{backToPlace}}" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; font-size: 16px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>{{pl.name}}</button>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;">What was different?</h1>
<p style="margin: 0; font-size: 15px; color: #4B4C3D;">Pick everything that applies.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{reportChips}}" as="c"><button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="min-height: 48px; border-radius: 16px; border: {{c.border}}; background: {{c.bg}}; padding: 0 14px; font-size: 15px; cursor: pointer;">{{c.label}}</button></sc-for>
</div>
<button type="button" onClick="{{sendReport}}" aria-disabled="{{reportDisabled}}" style="min-height: 56px; border: none; border-radius: 18px; background: {{reportBg}}; font-size: 17px; font-weight: 500; cursor: pointer;">Send</button>
<sc-if value="{{reportErr}}"><p role="alert" style="margin: 0; font-size: 15px; color: #8A3B1C;">Pick at least one thing that was different.</p></sc-if>
</div>
</sc-if>

<sc-if value="{{pVReported}}">
<div role="status" style="display: flex; flex-direction: column; gap: 14px;">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #2F6B3C; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2F3DC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.1;">Thanks. We’ll ask others to check.</h1>
<p style="margin: 0; font-size: 16px; color: #4B4C3D;">{{pl.name}} will show a warning until someone confirms the change.</p>
<p style="margin: 0; font-size: 13px; color: #5C5D4C;">{{savedNote}}</p>
<button type="button" onClick="{{backToList}}" style="min-height: 54px; border: none; border-radius: 16px; background: #26261F; font-size: 17px; cursor: pointer;"><span style="color: #F2F3DC;">Back to places</span></button>
</div>
</sc-if>

<!-- ===== Mapper: places that need answers ===== -->
<sc-if value="{{pMList}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
<span style="font-size: 16px; color: #4B4C3D;">{{areaName}}</span>
<button type="button" onClick="{{toCity}}" aria-label="Choose another area of London" style="min-height: 44px; display: flex; align-items: center; gap: 7px; border: 2px solid {{line}}; border-radius: 14px; background: transparent; padding: 0 12px; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>London</button>
</div>
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.08; color: #B4562A;">Which of these have you been to?</h1>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<span style="font-size: 14px; background: #F6E3CC; border-radius: 10px; padding: 6px 10px;">3 questions</span>
<span style="font-size: 14px; background: #F6E3CC; border-radius: 10px; padding: 6px 10px;">About 30 seconds</span>
<span style="font-size: 14px; background: #F6E3CC; border-radius: 10px; padding: 6px 10px;">No sign-up</span>
</div>
<sc-if value="{{askLocation}}">
<button type="button" onClick="{{locate}}" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid {{line}}; border-radius: 14px; background: #FBF6EC; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#233A6B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>Use my location to find places near me</button>
</sc-if>

<div id="dc-root"></div>
<noscript>Access London needs JavaScript to show the map.</noscript>
<script type="text/x-dc">
class Component extends DCLogic {
async componentDidMount() {
  // Opened by double-clicking the file? Browsers won't let a page read its data files from
  // file://, so nothing would load. Say so plainly instead of showing an empty grid.
  if (location.protocol === 'file:') {
    this.setState({ fatal: 'This page has to be opened through a local server, not by double-clicking the file. In VS Code: right-click map.html, then "Open with Live Server". Or in a terminal, in this folder: npx serve, then open the address it prints and add /map.html.' });
    return;
  }
  try { await this.start(); }
  catch (e) {
    console.error(e);
    this.setState({ fatal: 'The map’s data didn’t load (' + e.message + '). Check the data folder is next to map.html, then reload.' });
  }
}
async start() {
  // Things we only need once: the borough list, stations, and answers saved on this device.
  this.ans = LondonData.loadAnswers();
  // Shared Mapper answers (js/answers.js): connect, and redraw when the connection changes.
  Answers.onStatus((live) => this.setState({ live }));
  Answers.start();
  this.saved = LondonData.loadSaved();
  const [boroughs, stations, surveys] = await Promise.all([
    LondonData.getJSON('data/boroughs-map.json'), LondonData.getJSON('data/stations-slim.json'),
    LondonData.getJSON('data/surveys_hackney_summary.json').catch(() => [])]);
  this.boroughs = boroughs; this.stations = stations; this.surveys = surveys;
  // map.html?mode=map (from the home page's "Help map" button) opens in Mapper mode
  if (new URLSearchParams(location.search).get('mode') === 'map') this.setState({ mode: 'map' });
  // The real map. It lives in the #lm element the renderer never touches.
  this.lm = await LondonMap.create(document.getElementById('lm'), {
    onPick: (id) => this.pick(id),
    hoverCard: (id) => this.hoverCard(id),
    onMove: () => this.setState({ viewTick: (this.state.viewTick || 0) + 1 })
  });
  window.accessMap = this.lm.map; // handy for testing in the browser console
  try { if (localStorage.getItem('al-map-only')) this.setCollapsed(true); } catch (e) { /* private window */ }
  // Links like map.html#HCK or map.html#HCK/osm:node/123 open that borough (and place).
  const [ui, id] = decodeURIComponent(location.hash.slice(1)).split(/\/(.*)/);
  const b = boroughs.find((x) => x.ui === ui);
  if (b) await this.openArea(b.code, id);
  else this.setState({ ready: true });
}
componentWillUnmount() { clearTimeout(this.tt); }
// After every redraw, tell the map about anything that changed.
componentDidUpdate() {
  if (!this.lm) return;
  const S = this.state;
  const mode = S.mode || 'visit';
  const need = S.need || {};
  const rule = mode + '|' + ['ent', 'toilet'].filter((k) => need[k]).join(',') + '|' + (S.cats || []).join(',');
  if (rule !== this.lastRule) {
    this.lastRule = rule;
    this.lm.setRule({ mode, needs: ['ent', 'toilet'].filter((k) => need[k]), cats: S.cats || [] });
  }
  const open = (S.level === 'area') ? (mode === 'visit' ? S.sel : (S.mstep !== 'list' ? S.cur : null)) : null;
  const focus = (S.hover || '') + '|' + (open || '');
  if (focus !== this.lastFocus) { this.lastFocus = focus; this.lm.setFocus(S.hover || null, open || null); }
  if (S.level === 'area' && !this.wasArea) this.lm.resize();
  // a new step in the panel starts at the top
  if (this.panelState !== this.lastPanel) {
    this.lastPanel = this.panelState;
    const inner = document.querySelector('.ma-panel > div');
    if (inner) inner.scrollTop = 0;
  }
  this.wasArea = S.level === 'area';
}
// "Map only" on a laptop: hide the panel. Remembered on this device, so it stays how you left it.
setCollapsed(on) {
  this.setState({ collapsed: on });
  try { localStorage.setItem('al-map-only', on ? '1' : ''); } catch (e) { /* private window */ }
  if (this.lm) this.lm.setPanelOpen(!on);
}
// Send answers about one place (js/answers.js) and redraw it here straight away.
share(placeId, ans) {
  const code = this.data && this.data.code;
  if (!code) return;
  Answers.send(code, placeId, ans);
  LondonData.applyCrowd(this.data, this.ans);
  this.lm.refresh();
}
// Search picked something: open its borough if needed, then glide to the place.
async goSearch(go) {
  this.setState({ q: '' });
  if (!go) return;
  if (go.code !== this.state.area || this.state.level !== 'area') await this.openArea(go.code, go.id);
  else if (go.id) this.pick(go.id, true);
}
// Every place name in London, for search. Only downloaded the first time someone types.
loadIndex() {
  if (this.indexLoading) return;
  this.indexLoading = true;
  LondonData.getJSON('data/search-index.json').then((ix) => { this.index = ix; this.setState({ indexTick: 1 }); }).catch(() => { this.indexLoading = false; });
}
toast(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: null }), 2600); }

// Open a borough: download its places and outline, then show it on the real map.
async openArea(code, placeId) {
  const b = this.boroughs.find((x) => x.code === code);
  this.setState({ loading: true, loadingText: 'Loading ' + b.name + '…', level: 'area', area: code, boro: code, sel: null, cur: null, hover: null, vstep: 'list', mstep: 'list', q: '', sheet: 'open' });
  let data;
  try { data = await LondonData.loadBorough(code, this.surveys, this.ans); }
  catch (e) { console.error(e); this.setState({ loading: false, level: 'city', toast: b.name + '’s data didn’t load. Is the data folder complete?' }); return; }
  this.data = data;
  // Every Mapper answer for this borough, now and as they arrive. When two people agree,
  // the place changes for everyone who has the map open.
  LondonData.applyCrowd(data, this.ans);
  Answers.watch(code, () => {
    if (this.data !== data) return;
    LondonData.applyCrowd(data, this.ans);
    this.lm.refresh();
    this.setState({ crowdTick: (this.state.crowdTick || 0) + 1, viewTick: (this.state.viewTick || 0) + 1 });
  });
  await this.lm.openBorough({ code, boundary: data.boundary, places: data.places });
  history.replaceState(null, '', '#' + b.ui);
  this.setState({ loading: false, viewTick: (this.state.viewTick || 0) + 1 });
  if (placeId && data.byId[placeId]) this.pick(placeId, true);
}
// The card shown above a pin when the mouse points at it: the name, how far (when we know
// where you are), and icons for what's known.
hoverCard(id) {
  const S = this.state, D = LondonData;
  const f = this.data && this.data.byId[id];
  if (!f) return '';
  const p = f.properties, V = (S.mode || 'visit') === 'visit';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const m = S.you ? D.metres(S.you, f.geometry.coordinates) : null;
  const far = m == null ? '' : m > 4000 ? ' · ' + D.distanceText(m) + ' away' : ' · ' + D.minutes(m) + ' min away';
  const svg = (d, c) => '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  const SAY = { yes: ['#2F6B3C', 'none', '#FFFFFF', 'Yes'], partly: ['#7D7866', 'none', '#FFFFFF', 'Partly'], no: ['#7D7866', 'none', '#FFFFFF', 'No'], unknown: ['#FFFFFF', '2px dashed #6E6F5C', '#26261F', 'Not known'] };
  const ICONS = { ent: D.ICON.toilet /* the wheelchair figure */, lift: D.ICON.lift };
  const NAME = { ent: 'Step-free', toilet: 'Toilet', lift: 'Lift' };
  const keys = ['ent', 'toilet'].concat(D.answer(p, 'lift') !== 'unknown' ? ['lift'] : []);
  const chips = keys.map((k) => {
    const v = D.answer(p, k), s = SAY[v];
    const mark = k === 'toilet' ? '<span style="font-size:11px;font-weight:700;letter-spacing:0.02em;color:' + s[2] + '">WC</span>' : svg(ICONS[k], s[2]);
    return '<span class="ch"><span class="ci" style="background:' + s[0] + ';border:' + s[1] + '">' + mark + '</span>' + NAME[k] + ': ' + s[3] + '</span>';
  }).join('');
  let note = '';
  if (!V) note = p.ans ? 'You answered this place' : p.one ? 'One answer so far: 1 more confirms it' : D.answer(p, 'ent') === 'unknown' ? 'Nobody has answered yet. Tap to help' : '';
  else if (p.crowd && p.crowd.ent && p.crowd.ent.confirmed) note = 'Checked by ' + p.crowd.devices + ' people who agree';
  return '<b>' + esc(p.name) + '</b><span class="tm">' + esc(D.KIND[p.sub] || 'Place') + far + '</span>' +
    '<span class="tc">' + chips + '</span>' + (note ? '<span class="tn">' + note + '</span>' : '') +
    (p.survey ? '<span class="sim">Simulated test data</span>' : '');
}
pick(id, fly) {
  const S = this.state;
  const f = this.data && this.data.byId[id];
  if (!f) return;
  if (S.collapsed) this.setCollapsed(false); // the place's details are in the panel
  if ((S.mode || 'visit') === 'visit') this.setState({ sel: id, vstep: 'place', sheet: 'open', hover: null });
  else if (f.properties.wc === 'unknown' && !f.properties.ans) this.setState({ cur: id, mstep: 'confirm', sheet: 'open', hover: null });
  else { this.toast(f.properties.ans ? 'You already answered ' + f.properties.name + '. Thanks.' : f.properties.name + ' is already known.'); return; }
  if (fly) this.lm.flyTo(f.geometry.coordinates, 16);
}
// Where you are. Inside the open borough: show you and use it for distances. Elsewhere in
// London: open your borough. Outside London: say so.
// then: on the "Getting there" page we only want the distance, so the map stays where it is.
locate(then) {
  if (!navigator.geolocation) { this.toast('Your browser can’t share your location'); return; }
  this.toast('Finding where you are…');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const you = [pos.coords.longitude, pos.coords.latitude];
    this.lm.setYou(you);
    if (typeof then === 'function') { this.setState({ you, toast: null }); then(you); return; }
    const code = await LondonData.boroughAt(you);
    if (!code) { this.setState({ you }); this.toast('You seem to be outside London'); return; }
    if (code !== this.state.area || this.state.level !== 'area') await this.openArea(code);
    this.setState({ you });
    this.lm.flyTo(you, 15.5);
    this.toast('Showing places near you');
  }, () => this.toast('Location not shared. You can still look around the map.'), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

renderVals() {
const S = this.state;
const mode = S.mode || 'visit';
const V = mode === 'visit';
const level = S.level || 'city';
const need = S.need || { ent: false, toilet: false };
const cats = S.cats || []; // kinds of place picked; none picked means all
const q = (S.q || '').trim().toLowerCase();
const vstep = S.vstep || 'list';
const mstep = S.mstep || 'list';
const sheet = S.sheet || 'open';
const collapsed = !!S.collapsed;
const D = LondonData;
const IC = D.ICON;
const B = (this.boroughs || []).map((b) => [b.ui, b.name, b.row, b.col, b.score, b.checked, b.scoreOk, b.unknown, b.code]);
const greens = ['#E3E9C9', '#C2D69E', '#8DB866', '#4E8A4F', '#2A5E35'];
const oranges = ['#F6E9D2', '#F2C994', '#E8973F', '#C2602A', '#7E3417'];
// Colour steps, set to spread London's real figures across the five colours.
const gl = (s) => s < 60 ? 0 : s < 65 ? 1 : s < 69 ? 2 : s < 72 ? 3 : 4;
const ol = (m) => m < 75 ? 0 : m < 85 ? 1 : m < 90 ? 2 : m < 95 ? 3 : 4;
const KEYS = ['ent', 'toilet', 'lift'];
const NEEDN = { ent: 'Step-free way in', toilet: 'Accessible toilet', lift: 'Lift to other floors' };
const SHORT = { ent: 'Step-free', toilet: 'Toilet', lift: 'Lift' };
const chosen = ['ent', 'toilet'].filter((k) => need[k]);
const val = (p, k) => D.answer(p, k);
const status = (p, ks) => {
  const vs = (ks || (chosen.length ? chosen : ['ent'])).map((k) => val(p, k));
  if (vs.some((v) => v === 'no' || v === 'partly')) return 'nofit';
  if (vs.some((v) => v === 'unknown')) return 'unknown';
  return 'fit';

  share: () => { const url = location.href.split('#')[0] + '#' + areaB[0] + '/' + selP.id; if (navigator.share) navigator.share({ title: selP.name, url }).catch(() => {}); else navigator.clipboard.writeText(url).then(() => this.toast('Link copied'), () => this.toast(url)); } },
fillGap: () => selP && startFlow(selP.id),
// "Yes, it was": agree with what the panel shows (only the definite answers).
confirmRight: () => {
  const ans = {};
  for (const k of ['ent', 'toilet', 'lift']) { const v = val(selP, k); if (v !== 'unknown') ans[k] = v; }
  if (!Object.keys(ans).length) { this.toast('Nothing is known here yet. Use “Been here?” to add what you saw.'); return; }
  this.share(selP.id, ans);
  this.toast('Thanks. That counts as one more confirmation.');
},
startReport: () => this.setState({ vstep: 'report', rep: {}, repErr: false }),
reportChips: REP.map((r) => ({ label: r[1], pressed: rep[r[0]] ? 'true' : 'false', bg: rep[r[0]] ? '#E8873A' : 'transparent', border: rep[r[0]] ? '2px solid #E8873A' : '2px solid #B9A88C',
  toggle: () => { const n = Object.assign({}, rep); n[r[0]] = !n[r[0]]; this.setState({ rep: n, repErr: false }); } })),
reportDisabled: repAny ? 'false' : 'true', reportBg: repAny ? '#E8873A' : '#E3D3BC', reportErr: !!S.repErr,
// "Something was different" becomes answers too: steps at the door means no step-free way in.
sendReport: () => {
  if (!repAny) { this.setState({ repErr: true }); return; }
  const ans = {};
  if (rep.door) ans.ent = 'no';
  if (rep.toilet) ans.toilet = 'no';
  if (rep.lift) ans.lift = 'no';
  if (Object.keys(ans).length) this.share(selP.id, ans);
  this.setState({ vstep: 'reported' });
},
savedNote: saveNote,
gapCount: remaining.length.toLocaleString('en-GB') + (remaining.length === 1 ? ' place on the map needs' : ' places on the map need') + ' answers',
gaps: gapList.slice(0, 10).map((x) => { const p = x.p, done = !!p.ans; return { name: p.name, addr: addrOf(p), dist: distOf(x), icon: IC[p.cat],
  pinBg: done ? '#E8873A' : '#FFFFFF', pinFg: done ? '#26261F' : '#8A3B1C', pinBorder: done ? '3px solid #FFFFFF' : '3px dashed #B4562A',
  bg: done ? '#FBF6EC' : '#F6EDDC', ctaFg: done ? '#2A5E35' : '#8A3B1C', cta: done ? 'Done' : (p.one ? 'Needs 1 more' : 'I’ve been'),
  aria: p.name + ', ' + addrOf(p) + (you ? ', ' + Math.round(x.m) + ' metres' : '') + (done ? ', you answered' : ''),
  enter: () => this.setState({ hover: p.id }), leave: () => this.setState({ hover: null }),
  start: () => done ? this.toast('You already answered ' + p.name + '. Thanks.') : startFlow(p.id) }; }),
cur: cur ? { name: cur.name, addr: addrOf(cur) + ', ' + areaName, awning: awn[cur.cat], facadeLabel: 'Sketch of a shop front, not a photo of ' + cur.name } : { name: '', addr: '', awning: '#C2602A', facadeLabel: '' },
backToGaps: () => this.setState({ mstep: 'list', cur: null }),
confirmPlace: () => { const ks = ['ent', 'toilet', 'lift'].filter((k) => val(cur, k) === 'unknown'); this.setState({ mstep: 'q', qKeys: ks.length ? ks : ['ent'], qi: 0, draft: {} }); },
flagClosed: () => { this.toast('Thanks. We’ll check it has closed before removing it.'); this.setState({ mstep: 'list', cur: null }); },
qNum: qi + 1, qTotal: qKeys.length || 1, qText: QD[qk].t, qHint: QD[qk].h, qIcon: IC[qk],
segs: (qKeys.length ? qKeys : ['ent']).map((k, i) => i <= qi ? '#E8873A' : '#E3D3BC'),
qBack: () => { if (qi > 0) this.setState({ qi: qi - 1 }); else this.setState({ mstep: 'confirm' }); },
opts: QD[qk].o.map((o, i) => ({ label: o[1], bg: i === 0 ? '#26261F' : 'transparent', fg: i === 0 ? '#F2F3DC' : '#26261F', border: i === 0 ? '2px solid #26261F' : '2px solid #B9A88C',
  pick: () => {
    this.ans = D.saveAnswer(this.ans, S.cur, qk, o[0]);
    const draft = Object.assign({}, S.draft, { [qk]: o[0] });
    if (qi < qKeys.length - 1) this.setState({ qi: qi + 1, draft });
    else {
      // last question: share the answers (js/answers.js), then show what they did
      this.share(S.cur, draft);
      this.setState({ mstep: 'done', draft: {}, doneCount: (S.doneCount || 0) + 1, viewTick: (S.viewTick || 0) + 1 });
    }
  } })),
doneBig: nowConfirmed ? 'Confirmed' : '1 more', doneSmall: nowConfirmed ? 'it now shows for everyone' : 'answer confirms it',
liveDot: LIVE[0], liveText: LIVE[1],
doneCount: S.doneCount || 0, doneLabel: (S.doneCount || 0) === 1 ? 'place you helped today' : 'places you helped today', hasNext: !!next, next: next ? { name: next.p.name, addr: addrOf(next.p) + (you ? ', ' + D.distanceText(next.m) : '') } : { name: '', addr: '' },
startNext: () => next && startFlow(next.p.id),
hasToast: !!S.toast, toast: S.toast || '',
hasFatal: !!S.fatal, fatal: S.fatal || ''
};
}
}
</script>
