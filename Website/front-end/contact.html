<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Access London — contact us</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F2F3DC}
a{color:inherit}
.ct-in{width:100%;box-sizing:border-box;border:2px solid #C9C9AE;background:#FBFBF2;border-radius:16px;padding:14px 16px;font-family:'Outfit',Arial,sans-serif;font-size:17px;color:#26261F}
.ct-in:focus{outline:3px solid #2F6B3C;outline-offset:2px}
@container ctroot (max-width: 760px){.ct-hide-sm{display:none !important}}
</style>
<script src="js/dc-runtime.js"></script>
<link rel="stylesheet" href="css/data-integration.css">
<script src="js/access-data.js"></script>
<script src="js/contact-page.js"></script>
<link rel="stylesheet" href="css/site-shell.css"><script src="js/site-shell.js" defer></script></head>
<body data-page="contact">
<a class="site-skip" href="#page-content">Skip to content</a>
<header class="site-header"><a class="site-brand" href="index.html" aria-label="Access London home"><span>Access.</span><strong>London</strong></a><nav aria-label="Main navigation"><a href="map.html" data-nav="map">Explore map</a><a href="observations.html" data-nav="observations">Contribute</a><a href="how-to-use.html" data-nav="help">How to use</a><a href="about.html" data-nav="about">About &amp; data</a></nav></header>
<div id="page-content"></div>
<template id="dc-template">
<div style="container-type: inline-size; container-name: ctroot; min-height: 100vh; background: #F2F3DC; color: #26261F; font-family: 'Outfit', Arial, sans-serif;">



<main style="max-width: 1280px; margin: 0 auto; padding: 24px 28px 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
<p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 2px; color: #4E8A4F;">CONTACT US</p>
<h1 style="margin: 0; font-size: clamp(40px, 5vw, 64px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.02;">Tell us what’s wrong, or what would help.</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.45; color: #4B4C3D;">Prepare a message about this site. This static edition exports your message as a file; it does not send email.</p>
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 14px; background: #E3E6C4; border-radius: 20px; padding: 16px;">
<span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #2F6B3C; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3zM3 7l9 6 9-6"></path></svg></span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #5C5D4C;">Email</span><span style="font-size: 18px; font-weight: 600;">No contact inbox configured</span></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; background: #E3E6C4; border-radius: 20px; padding: 16px;">
<span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #2F6B3C; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path></svg></span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #5C5D4C;">Delivery</span><span style="font-size: 18px; font-weight: 600;">No response promise</span></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; background: #F6EDDC; border-radius: 20px; padding: 16px;">
<span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #E8873A; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#26261F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11zM12 10h.01"></path></svg></span>
<span style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #5C5D4C;">Know a place?</span><a href="observations.html" style="font-size: 18px; font-weight: 600;">Add its access info yourself</a></span>
</div>
</div>
</div>

<div style="flex: 1 1 520px; min-width: 0; background: #E3E6C4; border-radius: 30px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 20px; font-weight: 600; padding: 0 0 10px;">What’s it about?</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 72px; display: flex; align-items: center; gap: 12px; text-align: left; border-radius: 18px; border: {{t.border}}; background: {{t.bg}}; padding: 12px 14px; font-family: 'Outfit', Arial, sans-serif; font-size: 16px; font-weight: 500; color: #26261F; cursor: pointer;">
<span style="flex: none; width: 42px; height: 42px; border-radius: 13px; background: {{t.iconBg}}; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
<span>{{t.label}}</span>
</button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{isPlace}}" hint-placeholder-val="{{true}}">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; font-weight: 500;">Which place?
<input class="ct-in" type="text" value="{{place}}" onInput="{{onPlace}}" placeholder="For example, Canal Side Café">
</label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; font-weight: 500;">Your message
<textarea class="ct-in" rows="5" value="{{msg}}" onInput="{{onMsg}}" aria-invalid="{{msgInvalid}}" aria-describedby="ct-err" style="resize: vertical; border-color: {{msgBorder}};"></textarea>
</label>
<sc-if value="{{showErr}}" hint-placeholder-val="{{false}}">
<p id="ct-err" role="alert" style="margin: -8px 0 0; font-size: 16px; color: #8A3B1C; display: flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #8A3B1C; color: #F2F3DC; font-size: 14px; display: flex; align-items: center; justify-content: center;">!</span>Please write a few words so we know how to help.</p>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; font-weight: 500;">Email, if you’d like a reply <span style="font-size: 15px; font-weight: 400; color: #5C5D4C;">Optional</span>
<input class="ct-in" type="email" autocomplete="email" placeholder="you@example.com" value="{{email}}" onInput="{{onEmail}}">
</label>
<p role="alert">{{formError}}</p><button type="button" onClick="{{send}}" style="min-height: 60px; border-radius: 18px; border: none; background: #26261F; color: #F2F3DC; font-family: 'Outfit', Arial, sans-serif; font-size: 19px; font-weight: 500; cursor: pointer;">Download message draft</button>
<p style="margin: 0; font-size: 14px; color: #5C5D4C;">Your optional email is included only in the downloaded file. Nothing is sent to a server.</p>
</div>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 0;">
<span style="width: 84px; height: 84px; border-radius: 50%; background: #2F6B3C; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#F2F3DC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h2 style="margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.025em;">Your message file is ready.</h2>
<p style="margin: 0; font-size: 18px; color: #4B4C3D;">The file was downloaded to your device. It has not been delivered to the project team.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<a href="map.html" style="text-decoration: none; background: #26261F; color: #F2F3DC; border-radius: 16px; padding: 16px 22px; font-size: 17px;">Back to the map</a>
<button type="button" onClick="{{reset}}" style="min-height: 54px; border-radius: 16px; border: 2px solid #26261F; background: transparent; padding: 0 20px; font-family: 'Outfit', Arial, sans-serif; font-size: 17px; cursor: pointer;">Prepare another</button>
</div>
</div>
</sc-if>
</div>
</main>

<footer style="max-width: 1280px; margin: 0 auto; padding: 0 28px 36px; box-sizing: border-box;">
<div style="border-top: 1px solid #C9C9AE; padding-top: 20px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-size: 15px; color: #4B4C3D;">
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 18px;"><a href="index.html">Home</a><a href="map.html">Map</a><a href="about.html">About</a><a href="about.html">Accessibility statement</a><a href="contact.html">Contact</a></nav>
<span>Made by The DOMinators · UCL CASA0017 Web Architecture</span>
</div>
</footer>
</div>
</template>
<div id="dc-root"></div>
<noscript>Access London needs JavaScript to show the map.</noscript>
<script type="text/x-dc">class Component extends AccessContactPage {}</script>
</body>
</html>
